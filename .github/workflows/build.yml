name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing key
        env:
          RMHO_KEYSTORE_B64: ${{ secrets.RMHO_KEYSTORE_B64 }}
        run: |
          if [ -n "$RMHO_KEYSTORE_B64" ]; then
            echo "$RMHO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rmho-release.p12"
            echo "RMHO_KEYSTORE=$RUNNER_TEMP/rmho-release.p12" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests (aligner regression gate)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        env:
          RMHO_KS_PASS: ${{ secrets.RMHO_KS_PASS }}
          RMHO_KEY_ALIAS: ${{ secrets.RMHO_KEY_ALIAS }}
          RMHO_KEY_PASS: ${{ secrets.RMHO_KEY_PASS }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmho-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
